<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>MERN Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MERN Tracker"><meta name="theme-color" content="#1f3864">
<style>
:root{--bg:#f5f7fb;--fg:#1b2333;--card:#fff;--mut:#667085;--ac:#2e75b6;--ok:#2e9e5b;--bd:#dde3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161f;--fg:#e8ecf4;--card:#1b2230;--mut:#98a2b3;--ac:#6ea8e0;--ok:#4cc38a;--bd:#2c3547}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161f;--fg:#e8ecf4;--card:#1b2230;--mut:#98a2b3;--ac:#6ea8e0;--ok:#4cc38a;--bd:#2c3547}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 8px}h2{font-size:15px;margin:16px 0 6px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--ok)}
.row.cur{background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:8px}
.row .t{flex:1}.m{color:var(--mut);font-size:13px}.b{font-size:11px;border:1px solid var(--bd);border-radius:6px;padding:1px 5px;margin-left:4px}
a{color:var(--ac)}button,select,input[type=date]{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button.p{background:var(--ac);color:#fff;border:0}.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 2px}.bar i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 4px;font-size:13px;color:var(--mut)}nav button.on{color:var(--ac);font-weight:700}
.big{font-size:36px;font-weight:700}.flex{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
</style></head><body><main id="app"></main><nav id="nav"></nav>

E",9,44],["Same Tree",100,"E",9,45],["Subtree of Another Tree",572,"E",9,46],["Diameter of Binary Tree",543,"E",9,47],["Balanced Binary Tree",110,"E",9,48],["Lowest Common Ancestor of a BST",235,"M",9,49],["Binary Tree Level Order Traversal",102,"M",10,50],["Minimum Depth of Binary Tree",111,"E",10,50],["Average of Levels in Binary Tree",637,"E",10,51],["Binary Tree Right Side View",199,"M",10,51],["Validate Binary Search Tree",98,"M",10,52],["Kth Smallest Element in a BST",230,"M",10,52],["Kth Largest Element in a Stream",703,"E",11,53],["Last Stone Weight",1046,"E",11,53],["Kth Largest Element in an Array",215,"M",11,53],["K Closest Points to Origin",973,"M",11,54],["Top K Frequent Words",692,"M",11,54],["Task Scheduler",621,"M",11,54],["Flood Fill",733,"E",12,55],["Find if Path Exists in Graph",1971,"E",12,55],["Number of Islands",200,"M",12,55],["Max Area of Island",695,"M",12,56],["Clone Graph",133,"M",12,56],["Rotting Oranges",994,"M",12,57],["Course Schedule",207,"M",12,57],["Climbing Stairs",70,"E",13,58],["Min Cost Climbing Stairs",746,"E",13,58],["House Robber",198,"M",13,58],["Maximum Subarray",53,"M",13,59],["Coin Change",322,"M",13,59],["Word Break",139,"M",13,60],["Longest Increasing Subsequence",300,"M",13,60],["Summary Ranges",228,"E",14,0],["Merge Intervals",56,"M",14,0],["Insert Interval",57,"M",14,0],["Non-overlapping Intervals",435,"M",14,0],["Minimum Number of Arrows to Burst Balloons",452,"M",14,0],["Single Number",136,"E",15,0],["Number of 1 Bits",191,"E",15,0],["Missing Number",268,"E",15,0],["Counting Bits",338,"E",15,0],["Happy Number",202,"E",15,0]],"r":[[0,"The Complete JavaScript Course (Jonas Schmedtmann)","https://www.udemy.com/course/the-complete-javascript-course/"],[0,"React - The Complete Guide (Maximilian Schwarzmuller)","https://www.udemy.com/course/react-the-complete-guide-incl-redux/"],[0,"Node.js, Express, MongoDB & More (Jonas Schmedtmann)","https://www.udemy.com/course/nodejs-express-mongodb-bootcamp/"],[0,"MongoDB - The Complete Developer’s Guide (Max)","https://www.udemy.com/course/mongodb-the-complete-developers-guide/"],[0,"MERN Stack From Scratch - eCommerce (Brad Traversy)","https://www.traversymedia.com/mern-stack-from-scratch"],[0,"Understanding TypeScript (Max) - optional","https://www.udemy.com/course/understanding-typescript/"],[0,"Udemy search (if a course link above does not open)","https://www.udemy.com/courses/search/?q=mern%20stack"],[1,"javascript.info","https://javascript.info"],[1,"MDN Web Docs","https://developer.mozilla.org"],[1,"React official docs","https://react.dev"],[1,"Redux Toolkit docs","https://redux-toolkit.js.org"],[1,"React Router docs","https://reactrouter.com"],[1,"Node.js docs","https://nodejs.org/docs/latest/api/"],[1,"Express docs","https://expressjs.com"],[1,"Mongoose docs","https://mongoosejs.com/docs/"],[1,"MongoDB University","https://learn.mongodb.com"],[1,"MongoDB Atlas (free cluster)","https://www.mongodb.com/atlas"],[1,"Postman","https://www.postman.com"],[1,"jwt.io","https://jwt.io"],[1,"Git documentation","https://git-scm.com/doc"],[1,"GitHub Skills","https://skills.github.com"],[1,"Render docs","https://render.com/docs"],[1,"Vercel docs","https://vercel.com/docs"],[1,"roadmap.sh - Full Stack","https://roadmap.sh/full-stack"],[2,"LeetCode","https://leetcode.com"],[2,"NeetCode","https://neetcode.io"],[2,"GreatFrontEnd","https://www.greatfrontend.com"],[2,"Big-O Cheat Sheet","https://www.bigocheatsheet.com"],[2,"VisuAlgo","https://visualgo.net"],[3,"Pramp","https://www.pramp.com"],[3,"interviewing.io","https://interviewing.io"],[4,"LinkedIn Jobs","https://www.linkedin.com/jobs/"],[4,"Naukri","https://www.naukri.com"],[4,"Wellfound","https://wellfound.com/jobs"],[4,"Indeed India","https://in.indeed.com"],[4,"Instahyre","https://www.instahyre.com"],[4,"Cutshort","https://cutshort.io"]],"t":["Jonas course: Fundamentals Part 1 and Part 2 (variables, types, operators, conditionals, functions, arrays, objects, loops). Code along and do every challenge. Skip Welcome and How to Navigate.","Developer Skills (skim, debugging parts only). How JavaScript Works Behind the Scenes: hoisting, scope chain, this, primitives vs reference values. Write your own 5 hoisting/scope/closure examples.","Data Structures, Modern Operators and Strings: destructuring, spread/rest, optional chaining, Sets, Maps, string methods. Do the coding challenges.","A Closer Look at Functions (closures, call/apply/bind, higher-order functions, IIFE). Working With Arrays: map, filter, reduce, find (skim the Bankist UI building).","DOM and Events (concepts + ONE mini project). Advanced DOM: bubbling, capturing, event delegation only. Skim Numbers, Dates and Timers (keep setTimeout/setInterval).","Object-Oriented Programming: constructors, prototypes, ES6 classes, Object.create, inheritance. Modern JS Modules and Tooling: import/export and npm basics only.","Asynchronous JavaScript: callbacks, promises, fetch, async/await, event loop, Promise.all/race. Then build a small weather/todo fetch app WITHOUT the video. Learn Git basics (init/add/commit/push) and push it to GitHub."],"g":["Courses","Docs & free learning","DSA practice","Mock interviews","Job boards"]};
const TABS=[["today","Today"],["plan","Plan"],["dsa","DSA"],["links","Links"]];
const OV={"Two Sum II (sorted input)":"two-sum-ii-input-array-is-sorted","Lowest Common Ancestor of a BST":"lowest-common-ancestor-of-a-binary-search-tree"};
const slug=t=>OV[t]||t.toLowerCase().replace(/[^a-z0-9 ]/g," ").trim().split(/\s+/).join("-");
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let S={start:iso(new Date()),day:0,done:{},dsa:{}},tab="today",flt=-1;
const KEY="mern-tracker";
const idb=(m,v)=>new Promise(res=>{try{const q=indexedDB.open("mern",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>{const t=q.result.transaction("k",m=="get"?"readonly":"readwrite").objectStore("k");const r=m=="get"?t.get(KEY):t.put(v,KEY);r.onsuccess=()=>res(r.result);r.onerror=()=>res()};q.onerror=()=>res()}catch(e){res()}});
const save=()=>{S.saved=Date.now();const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}idb("put",j)};
const parse=j=>{try{return JSON.parse(j)}catch(e){return null}};
const auto=()=>Math.max(1,Math.min(60,Math.floor((new Date(iso(new Date()))-new Date(S.start))/864e5)+1));
const cur=()=>S.day||auto();
const nDone=Object.keys(S.done).length,pct=(a,b)=>Math.round(100*a/b);
function prog(){const a=Object.keys(S.done).length,b=Object.keys(S.dsa).length;
return `<div class="card"><div class="m">Schedule ${a}/60</div><div class="bar"><i style="width:${pct(a,60)}%"></i></div><div class="m">DSA ${b}/${D.d.length}</div><div class="bar"><i style="width:${pct(b,D.d.length)}%"></i></div></div>`}
function dsaRow(p,i){return `<label class="row"><input type="checkbox" data-k="dsa" data-i="${i}" ${S.dsa[i]?"checked":""}><span class="t"><a href="https://leetcode.com/problems/${slug(p[0])}/" target="_blank" rel="noopener">${p[0]}</a><span class="b">${{E:"Easy",M:"Medium"}[p[2]]}</span><div class="m">${D.p[p[3]]}${p[4]?" · Day "+p[4]:""}</div></span></label>`}
function view(){let h="";
if(tab=="today"){const d=cur(),i=d-1;
h=`<h1>Today’s plan</h1>${prog()}<div class="card"><div class="flex"><button data-a="prev">‹ Prev</button><div style="text-align:center"><div class="big">Day ${d}</div><div class="m">${d<=30?"Month 1 · Concepts":"Month 2 · Interview"}</div></div><button data-a="next">Next ›</button></div></div>
<div class="card"><div class="m">Focus</div><div style="font-size:18px;font-weight:600;margin:2px 0 6px">${D.s[i]}</div>${D.t[i]?`<div class="m" style="margin-bottom:10px">${D.t[i]}</div>`:""}<button class="p" data-a="toggle">${S.done[d]?"✓ Done (tap to undo)":"Mark day done"}</button></div>
<h2>DSA for today</h2><div class="card">${D.d.map((p,j)=>p[4]==d?dsaRow(p,j):"").join("")||'<div class="m">No DSA scheduled.</div>'}</div>
<div class="card flex"><span class="m">Start date</span><input type="date" id="st" value="${S.start}"><button data-a="auto">Auto day</button></div>`}
if(tab=="plan")h=`<h1>60-day plan</h1>${prog()}<div class="card">${D.s.map((f,i)=>`<label class="row ${i+1==cur()?"cur":""}"><input type="checkbox" data-k="done" data-i="${i+1}" ${S.done[i+1]?"checked":""}><span class="t"><b>Day ${i+1}</b> · ${f}${S.done[i+1]&&S.done[i+1]!==1?'<div class="m">Done '+S.done[i+1]+'</div>':''}</span></label>`).join("")}</div>`;
if(tab=="dsa")h=`<h1>DSA by pattern</h1>${prog()}<select id="f"><option value="-1">All patterns</option>${D.p.map((p,i)=>`<option value="${i}" ${flt==i?"selected":""}>${p}</option>`).join("")}</select><div class="card">${D.d.map((p,j)=>flt<0||p[3]==flt?dsaRow(p,j):"").join("")}</div><p class="m">Solve in JavaScript. Redo problems you needed help with after 1 day and 1 week.</p>`;
if(tab=="links")h="<h1>Resources</h1>"+D.g.map((g,k)=>`<h2>${g}</h2><div class="card">${D.r.filter(r=>r[0]==k).map(r=>`<div class="row"><span class="t"><a href="${r[2]}" target="_blank" rel="noopener">${r[1]}</a></span></div>`).join("")}</div>`).join("")+'<p class="m">Udemy links may need a search if a course page moved.</p>';
app.innerHTML=h;nav.innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${tab==t[0]?"on":""}">${t[1]}</button>`).join("");window.scrollTo(0,0)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.t){tab=b.dataset.t;view()}
const a=b.dataset.a;if(a=="prev"){S.day=Math.max(1,cur()-1)}if(a=="next"){S.day=Math.min(60,cur()+1)}if(a=="auto"){S.day=0}
if(a=="toggle"){const d=cur();S.done[d]?delete S.done[d]:S.done[d]=iso(new Date())}
if(a){save();view()}});
document.addEventListener("change",e=>{const t=e.target;
if(t.dataset.k){const o=S[t.dataset.k];t.checked?o[t.dataset.i]=iso(new Date()):delete o[t.dataset.i];save();const y=scrollY;view();scrollTo(0,y)}
if(t.id=="st"&&t.value){S.start=t.value;S.day=0;save();view()}
if(t.id=="f"){flt=+t.value;view()}});
let ls=null;try{ls=localStorage.getItem(KEY)}catch(e){}
idb("get").then(j=>{const a=parse(ls),b=parse(j);const best=!a?b:!b?a:(b.saved||0)>(a.saved||0)?b:a;if(best&&best.done)S=Object.assign(S,best);view()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
